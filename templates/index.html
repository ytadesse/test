<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Ambient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 520px; height: 520px; background: #7c3aed; top: -120px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #2563eb; bottom: -100px; right: -80px; animation-delay: -4s; }
    .blob-3 { width: 300px; height: 300px; background: #db2777; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }
    .blob-3 { animation-name: drift-center; }
    @keyframes drift-center {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(calc(-50% + 20px), calc(-50% + 15px)) scale(1.1); }
    }

    /* Card */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 60px 72px;
      text-align: center;
      max-width: 520px;
      width: 90%;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(124, 58, 237, 0.25);
      border: 1px solid rgba(124, 58, 237, 0.5);
      color: #c4b5fd;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #a78bfa 70%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 18px;
    }

    p {
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 24px rgba(124, 58, 237, 0.45);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.6);
    }
    .btn:active { transform: translateY(0); opacity: 0.85; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 36px 0 28px;
      color: rgba(255,255,255,0.2);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    /* Stats row */
    .stats {
      display: flex;
      justify-content: center;
      gap: 36px;
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .stat-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    /* Pulse dot */
    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      margin-top: 32px;
    }
    .dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="badge">Flask + Python</div>
    <h1>Hello, World!</h1>
    <p>A minimal Flask web app, ready to build on.<br>Deploy anywhere, scale fast.</p>
    <a class="btn" href="#">Get Started</a>

    <div class="divider">stats</div>
    <div class="stats">
      <div>
        <div class="stat-value">1</div>
        <div class="stat-label">Route</div>
      </div>
      <div>
        <div class="stat-value">0 ms</div>
        <div class="stat-label">Latency</div>
      </div>
      <div>
        <div class="stat-value">∞</div>
        <div class="stat-label">Potential</div>
      </div>
    </div>

    <div class="live"><span class="dot"></span> Server is running</div>
  </div>
</body>
</html>
