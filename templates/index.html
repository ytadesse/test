<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Woofpedia — AI Dog Breed Identifier</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b0e;
      --surface: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.10);
      --text: #f0f0f5;
      --muted: rgba(255,255,255,0.45);
      --purple: #7c3aed;
      --blue: #2563eb;
      --pink: #db2777;
      --green: #4ade80;
      --amber: #fbbf24;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* ── Blobs ── */
    .blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: 0.28;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .blob-1 { width: 600px; height: 600px; background: var(--purple); top: -200px; left: -150px; }
    .blob-2 { width: 450px; height: 450px; background: var(--blue);   bottom: -120px; right: -100px; animation-delay: -5s; }
    .blob-3 { width: 280px; height: 280px; background: var(--pink);   top: 40%; left: 60%; animation-delay: -9s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(25px,18px) scale(1.07); }
    }

    /* ── Layout ── */
    .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 48px 24px 80px; }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 48px; }
    .logo { font-size: 2.8rem; margin-bottom: 8px; }
    header h1 {
      font-size: clamp(2rem, 5vw, 3rem); font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #fff 30%, #a78bfa 65%, #60a5fa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    header p { color: var(--muted); margin-top: 10px; font-size: 1.05rem; }

    /* ── Upload zone ── */
    #upload-section { margin-bottom: 32px; }

    .drop-zone {
      border: 2px dashed rgba(124,58,237,0.5);
      border-radius: 20px;
      padding: 56px 32px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      background: rgba(124,58,237,0.04);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragging {
      background: rgba(124,58,237,0.10);
      border-color: rgba(124,58,237,0.9);
    }
    .drop-zone input { display: none; }
    .drop-icon { font-size: 3rem; margin-bottom: 16px; }
    .drop-zone h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .drop-zone p  { color: var(--muted); font-size: 0.9rem; }
    .drop-zone .browse {
      color: #a78bfa; font-weight: 600; cursor: pointer; text-decoration: underline;
    }

    /* ── Preview ── */
    #preview-wrap {
      display: none; margin-bottom: 24px;
      border-radius: 20px; overflow: hidden;
      border: 1px solid var(--border);
      position: relative; max-height: 420px;
    }
    #preview-wrap img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
    #change-btn {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.7); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
      padding: 6px 16px; font-size: 0.82rem; cursor: pointer;
      backdrop-filter: blur(8px); transition: background 0.15s;
    }
    #change-btn:hover { background: rgba(0,0,0,0.9); }

    /* ── Analyse button ── */
    #analyze-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff; font-size: 1rem; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(124,58,237,0.4);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      display: none;
    }
    #analyze-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,58,237,0.55); }
    #analyze-btn:active { transform: translateY(0); opacity: 0.85; }
    #analyze-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Loader ── */
    #loader { display: none; text-align: center; padding: 60px 0; }
    .paw-spin {
      font-size: 3rem;
      display: inline-block;
      animation: spin 1.1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: var(--muted); font-size: 1rem; }
    #loader-msg { color: var(--text); font-weight: 600; margin-top: 6px; }

    /* ── Error ── */
    #error-box {
      display: none; background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.4);
      border-radius: 12px; padding: 16px 20px;
      color: #fca5a5; margin-bottom: 24px;
    }

    /* ── Results ── */
    #results { display: none; }

    /* Hero */
    .breed-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 40px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .breed-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(124,58,237,0.12), rgba(37,99,235,0.08));
      pointer-events: none;
    }
    .confidence-badge {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 999px;
      margin-bottom: 14px;
    }
    .conf-high   { background: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid rgba(74,222,128,0.4); }
    .conf-medium { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.4); }
    .conf-low    { background: rgba(248,113,113,0.2); color: #f87171; border: 1px solid rgba(248,113,113,0.4); }
    .breed-name {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 8px;
    }
    .breed-tagline { color: var(--muted); font-size: 1.1rem; font-style: italic; }
    .lookalike-chip {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 18px;
      background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3);
      border-radius: 999px; padding: 6px 16px;
      font-size: 0.85rem; color: var(--amber);
    }

    /* Cards row */
    .cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 560px) { .cards-row { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 24px 28px;
    }
    .card-title {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .origin-country { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .origin-era     { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
    .origin-story   { color: rgba(255,255,255,0.7); font-size: 0.92rem; line-height: 1.7; }

    /* Traits */
    .traits { display: flex; flex-wrap: wrap; gap: 8px; }
    .trait-pill {
      background: rgba(124,58,237,0.18);
      border: 1px solid rgba(124,58,237,0.35);
      border-radius: 999px; padding: 5px 14px;
      font-size: 0.82rem; color: #c4b5fd; font-weight: 500;
    }

    /* Ratings */
    .rating-row { margin-bottom: 12px; }
    .rating-row:last-child { margin-bottom: 0; }
    .rating-label {
      display: flex; justify-content: space-between;
      font-size: 0.85rem; margin-bottom: 5px;
    }
    .rating-label span:last-child { color: var(--muted); }
    .bar-track {
      height: 6px; background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
      transition: width 1s cubic-bezier(0.4,0,0.2,1);
      width: 0;
    }

    /* Fun facts */
    .section-title {
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .fact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .fact-num {
      flex-shrink: 0;
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      border-radius: 8px;
      font-size: 0.75rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .fact-text { font-size: 0.88rem; line-height: 1.6; color: rgba(255,255,255,0.8); }

    /* Famous owners */
    .owners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px; margin-bottom: 32px;
    }
    .owner-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
    }
    .owner-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .owner-note { color: var(--muted); font-size: 0.8rem; line-height: 1.5; }

    /* Retry */
    #retry-btn {
      display: block; margin: 0 auto;
      padding: 12px 36px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text); font-size: 0.9rem; font-weight: 600;
      border-radius: 999px; cursor: pointer;
      transition: background 0.2s;
    }
    #retry-btn:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page">
    <header>
      <div class="logo">🐾</div>
      <h1>Woofpedia</h1>
      <p>Drop a dog photo. Get 10 fun facts, origin story, famous owners & more — powered by Gemini AI.</p>
    </header>

    <!-- Upload -->
    <div id="upload-section">
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/*"/>
        <div class="drop-icon">🐶</div>
        <h2>Drop your dog photo here</h2>
        <p>or <span class="browse" id="browse-link">browse to upload</span></p>
        <p style="margin-top:8px; font-size:0.8rem;">JPG, PNG, WEBP — any size</p>
      </div>

      <div id="preview-wrap">
        <img id="preview-img" src="" alt="Dog preview"/>
        <button id="change-btn">✕ Change photo</button>
      </div>

      <div id="error-box"></div>

      <button id="analyze-btn">🔍 &nbsp;Identify Breed</button>
    </div>

    <!-- Loader -->
    <div id="loader">
      <div class="paw-spin">🐾</div>
      <p>Sniffing through the data…</p>
      <p id="loader-msg"></p>
    </div>

    <!-- Results -->
    <div id="results">

      <!-- Breed hero -->
      <div class="breed-hero">
        <div id="confidence-badge" class="confidence-badge"></div>
        <div id="breed-name" class="breed-name"></div>
        <div id="breed-tagline" class="breed-tagline"></div>
        <div id="lookalike-chip" class="lookalike-chip" style="display:none">
          <span>🌟</span><span id="lookalike-text"></span>
        </div>
      </div>

      <!-- Origin + Traits -->
      <div class="cards-row">
        <div class="card" id="origin-card">
          <div class="card-title">🗺️ &nbsp;Origin</div>
          <div id="origin-country" class="origin-country"></div>
          <div id="origin-era" class="origin-era"></div>
          <div id="origin-story" class="origin-story"></div>
        </div>
        <div class="card">
          <div class="card-title">✨ &nbsp;Personality</div>
          <div id="traits" class="traits" style="margin-bottom:20px"></div>
          <div class="card-title" style="margin-top:4px">📊 &nbsp;Ratings</div>
          <div id="ratings"></div>
        </div>
      </div>

      <!-- Fun facts -->
      <div class="section-title">🎉 &nbsp;10 Fun Facts</div>
      <div id="facts-grid" class="facts-grid"></div>

      <!-- Famous owners -->
      <div class="section-title">👑 &nbsp;Famous Owners</div>
      <div id="owners-grid" class="owners-grid"></div>

      <button id="retry-btn">🐾 &nbsp;Analyse another dog</button>
    </div>
  </div>

  <script>
    const dropZone   = document.getElementById("drop-zone");
    const fileInput  = document.getElementById("file-input");
    const browseLink = document.getElementById("browse-link");
    const previewWrap= document.getElementById("preview-wrap");
    const previewImg = document.getElementById("preview-img");
    const changeBtn  = document.getElementById("change-btn");
    const analyzeBtn = document.getElementById("analyze-btn");
    const loader     = document.getElementById("loader");
    const loaderMsg  = document.getElementById("loader-msg");
    const results    = document.getElementById("results");
    const errorBox   = document.getElementById("error-box");
    const uploadSec  = document.getElementById("upload-section");

    let selectedFile = null;

    const loadingQuips = [
      "Consulting the ancient scrolls of dog breeds…",
      "Sniffing for clues…",
      "Asking Gemini to fetch the answer…",
      "Cross-referencing 400 breeds…",
      "Checking paw prints…",
      "Almost there — good boy!",
    ];
    let quipInterval;

    function showPreview(file) {
      selectedFile = file;
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewWrap.style.display = "block";
      dropZone.style.display = "none";
      analyzeBtn.style.display = "block";
      errorBox.style.display = "none";
    }

    function resetToUpload() {
      selectedFile = null;
      previewWrap.style.display = "none";
      dropZone.style.display = "block";
      analyzeBtn.style.display = "none";
      results.style.display = "none";
      loader.style.display = "none";
      uploadSec.style.display = "block";
      errorBox.style.display = "none";
      fileInput.value = "";
    }

    browseLink.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) showPreview(fileInput.files[0]);
    });

    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragging"); });
    dropZone.addEventListener("dragleave",  () => dropZone.classList.remove("dragging"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault(); dropZone.classList.remove("dragging");
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) showPreview(file);
    });

    changeBtn.addEventListener("click", resetToUpload);
    document.getElementById("retry-btn").addEventListener("click", resetToUpload);

    analyzeBtn.addEventListener("click", async () => {
      if (!selectedFile) return;

      // Show loader
      uploadSec.style.display = "none";
      results.style.display = "none";
      loader.style.display = "block";
      errorBox.style.display = "none";
      analyzeBtn.disabled = true;

      let q = 0;
      loaderMsg.textContent = loadingQuips[q];
      quipInterval = setInterval(() => {
        q = (q + 1) % loadingQuips.length;
        loaderMsg.textContent = loadingQuips[q];
      }, 2200);

      const formData = new FormData();
      formData.append("image", selectedFile);

      try {
        const res = await fetch("/analyze", { method: "POST", body: formData });
        const data = await res.json();
        clearInterval(quipInterval);

        if (!res.ok || data.error) {
          showError(data.error || "Something went wrong.");
          return;
        }
        renderResults(data);
      } catch (err) {
        clearInterval(quipInterval);
        showError("Network error — please try again.");
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    function showError(msg) {
      loader.style.display = "none";
      uploadSec.style.display = "block";
      errorBox.textContent = "⚠️  " + msg;
      errorBox.style.display = "block";
      previewWrap.style.display = "block";
      dropZone.style.display = "none";
      analyzeBtn.style.display = "block";
    }

    function renderResults(d) {
      loader.style.display = "none";

      // Hero
      const confEl = document.getElementById("confidence-badge");
      confEl.textContent = (d.confidence || "high").toUpperCase() + " CONFIDENCE";
      confEl.className = "confidence-badge conf-" + (d.confidence || "high").toLowerCase();

      document.getElementById("breed-name").textContent    = d.breed    || "Unknown";
      document.getElementById("breed-tagline").textContent = d.tagline  || "";

      if (d.celeb_lookalike) {
        document.getElementById("lookalike-text").textContent = `Personality twin: ${d.celeb_lookalike}`;
        document.getElementById("lookalike-chip").style.display = "inline-flex";
      }

      // Origin
      const o = d.origin || {};
      document.getElementById("origin-country").textContent = (o.country || "") + (o.country ? " 🌍" : "");
      document.getElementById("origin-era").textContent     = o.era || "";
      document.getElementById("origin-story").textContent   = o.story || "";

      // Traits
      const traitsEl = document.getElementById("traits");
      traitsEl.innerHTML = (d.personality_traits || [])
        .map(t => `<span class="trait-pill">${t}</span>`).join("");

      // Ratings
      const ratingsEl = document.getElementById("ratings");
      const ratingMap = [
        { key: "energy",        label: "Energy",       emoji: "⚡" },
        { key: "friendliness",  label: "Friendliness", emoji: "🤝" },
        { key: "trainability",  label: "Trainability", emoji: "🎓" },
        { key: "fluffiness",    label: "Fluffiness",   emoji: "☁️" },
      ];
      ratingsEl.innerHTML = ratingMap.map(({ key, label, emoji }) => {
        const val = (d.ratings || {})[key] || 5;
        return `
          <div class="rating-row">
            <div class="rating-label">
              <span>${emoji} ${label}</span>
              <span>${val}/10</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" data-width="${val * 10}"></div>
            </div>
          </div>`;
      }).join("");

      // Fun facts
      const factsEl = document.getElementById("facts-grid");
      factsEl.innerHTML = (d.fun_facts || []).map((f, i) => `
        <div class="fact-card">
          <div class="fact-num">${i + 1}</div>
          <div class="fact-text">${f}</div>
        </div>`).join("");

      // Famous owners
      const ownersEl = document.getElementById("owners-grid");
      ownersEl.innerHTML = (d.famous_owners || []).map(o => `
        <div class="owner-card">
          <div class="owner-name">👑 ${o.name}</div>
          <div class="owner-note">${o.note}</div>
        </div>`).join("");

      results.style.display = "block";
      results.scrollIntoView({ behavior: "smooth", block: "start" });

      // Animate bars after render
      setTimeout(() => {
        document.querySelectorAll(".bar-fill").forEach(bar => {
          bar.style.width = bar.dataset.width + "%";
        });
      }, 120);
    }
  </script>
</body>
</html>
